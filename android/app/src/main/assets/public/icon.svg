<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="ball-red" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="ball-blue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
    <radialGradient id="ball-amber" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <radialGradient id="ball-emerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for Android -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Glass Tube Outline -->
  <g filter="url(#glow)">
    <!-- Tube Body -->
    <rect x="186" y="90" width="140" height="340" rx="70" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="14"/>
    <path d="M170 90 L342 90" stroke="rgba(255,255,255,0.8)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Balls inside Tube -->
  <!-- Top floating Ball (Red) -->
  <circle cx="256" cy="170" r="44" fill="url(#ball-red)"/>
  <ellipse cx="242" cy="155" rx="16" ry="10" fill="rgba(255,255,255,0.7)" transform="rotate(-30 242 155)"/>

  <!-- Ball 2 (Amber) -->
  <circle cx="256" cy="260" r="44" fill="url(#ball-amber)"/>
  <ellipse cx="242" cy="245" rx="16" ry="10" fill="rgba(255,255,255,0.7)" transform="rotate(-30 242 245)"/>

  <!-- Ball 3 (Blue) -->
  <circle cx="256" cy="350" r="44" fill="url(#ball-blue)"/>
  <ellipse cx="242" cy="335" rx="16" ry="10" fill="rgba(255,255,255,0.7)" transform="rotate(-30 242 335)"/>

  <!-- Sparkles -->
  <path d="M 380 120 Q 380 140 400 140 Q 380 140 380 160 Q 380 140 360 140 Q 380 140 380 120 Z" fill="#fbbf24"/>
  <path d="M 120 280 Q 120 295 135 295 Q 120 295 120 310 Q 120 295 105 295 Q 120 295 120 280 Z" fill="#38bdf8"/>
</svg>
